<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Reactive Music Wallpaper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05050f;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #ui {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 0 20px rgba(100, 150, 255, 0.5);
    }
    #time {
      font-size: 4.2rem;
      font-weight: 200;
      letter-spacing: 4px;
      margin-bottom: 6px;
    }
    #status {
      font-size: 0.95rem;
      opacity: 0.75;
      letter-spacing: 1px;
    }
    #date {
      font-size: 1rem;
      margin-top: 10px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="ui">
    <div id="time">00:00</div>
    <div id="status">Listening for music...</div>
    <div id="date"></div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const timeEl = document.getElementById('time');
    const statusEl = document.getElementById('status');
    const dateEl = document.getElementById('date');

    let width, height;
    let audioContext, analyser, dataArray, bufferLength;
    let particles = [];
    let isAudioActive = false;
    let bass = 0, mid = 0, treble = 0;
    let smoothBass = 0;

    const particleCount = 80;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initParticles();
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < particleCount; i++) {
        particles.push({
          angle: Math.random() * Math.PI * 2,
          radius: 80 + Math.random() * 220,
          size: Math.random() * 2.2 + 0.8,
          speed: 0.002 + Math.random() * 0.008,
          opacity: Math.random() * 0.5 + 0.2,
          hue: 200 + Math.random() * 80
        });
      }
    }

    async function setupAudio() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.85;
        source.connect(analyser);

        bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
        isAudioActive = true;
        statusEl.textContent = "Music Reactive Mode • Active";
      } catch (err) {
        console.log("Microphone not available:", err);
        statusEl.textContent = "Idle Mode • Mic permission needed";
        isAudioActive = false;
      }
    }

    function getAudioData() {
      if (!isAudioActive || !analyser) return;

      analyser.getByteFrequencyData(dataArray);

      // Bass (low frequencies)
      let bassSum = 0;
      for (let i = 0; i < 10; i++) bassSum += dataArray[i];
      bass = bassSum / 10 / 255;

      // Mid
      let midSum = 0;
      for (let i = 10; i < 40; i++) midSum += dataArray[i];
      mid = midSum / 30 / 255;

      // Treble
      let trebleSum = 0;
      for (let i = 40; i < 80; i++) trebleSum += dataArray[i];
      treble = trebleSum / 40 / 255;

      // Smooth bass for nicer pulse
      smoothBass += (bass - smoothBass) * 0.15;
    }

    function draw() {
      // Dark fading background
      ctx.fillStyle = 'rgba(5, 5, 15, 0.25)';
      ctx.fillRect(0, 0, width, height);

      getAudioData();

      const centerX = width / 2;
      const centerY = height / 2;
      const pulse = isAudioActive ? (0.7 + smoothBass * 1.8) : (0.9 + Math.sin(Date.now() * 0.001) * 0.1);

      // Outer glowing rings
      for (let i = 0; i < 4; i++) {
        const ringRadius = (90 + i * 55) * pulse + (isAudioActive ? mid * 40 : 0);
        const alpha = 0.12 - i * 0.02;

        ctx.beginPath();
        ctx.arc(centerX, centerY, ringRadius, 0, Math.PI * 2);
        ctx.strokeStyle = `hsla(${210 + bass * 60}, 90%, 65%, ${alpha})`;
        ctx.lineWidth = 2 + bass * 4;
        ctx.stroke();
      }

      // Center core
      const coreGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 70 * pulse);
      coreGradient.addColorStop(0, `hsla(${200 + bass * 80}, 100%, 75%, ${0.3 + bass * 0.4})`);
      coreGradient.addColorStop(1, 'transparent');
      ctx.fillStyle = coreGradient;
      ctx.beginPath();
      ctx.arc(centerX, centerY, 70 * pulse, 0, Math.PI * 2);
      ctx.fill();

      // Particles orbiting
      particles.forEach(p => {
        p.angle += p.speed * (1 + smoothBass * 3);

        const reactRadius = p.radius * (1 + smoothBass * 0.6 + mid * 0.3);
        const x = centerX + Math.cos(p.angle) * reactRadius;
        const y = centerY + Math.sin(p.angle) * reactRadius;

        const size = p.size * (1 + bass * 1.5);

        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.hue + treble * 40}, 90%, 70%, ${p.opacity + bass * 0.3})`;
        ctx.shadowBlur = 12;
        ctx.shadowColor = `hsla(${p.hue}, 100%, 60%, 0.8)`;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Frequency bars (bottom subtle)
      if (isAudioActive && dataArray) {
        const barCount = 64;
        const barWidth = width / barCount;

        for (let i = 0; i < barCount; i++) {
          const value = dataArray[i] / 255;
          const barHeight = value * 80;

          ctx.fillStyle = `hsla(${200 + i * 1.5}, 90%, 60%, ${0.15 + value * 0.3})`;
          ctx.fillRect(i * barWidth, height - barHeight, barWidth - 1, barHeight);
        }
      }

      requestAnimationFrame(draw);
    }

    function updateClock() {
      const now = new Date();
      timeEl.textContent = now.toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
      dateEl.textContent = now.toLocaleDateString('en-IN', {
        weekday: 'long',
        day: 'numeric',
        month: 'long'
      });
    }

    // Init
    window.addEventListener('resize', resize);
    resize();
    setupAudio();
    draw();
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
